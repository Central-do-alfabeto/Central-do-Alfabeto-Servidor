# Ambiente de desenvolvimento local: Postgres + backend.
# As variáveis vêm do ambiente do shell (ou de um .env local lido pelo próprio Compose);
# veja .env.example. Nada sensível é versionado aqui.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: centraldoalfabeto
      POSTGRES_USER: ${DATABASE_USERNAME:?defina DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d centraldoalfabeto"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/centraldoalfabeto
      DATABASE_USERNAME: ${DATABASE_USERNAME:?defina DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    restart: unless-stopped

volumes:
  pgdata:
