# Todas as credenciais vêm de variáveis de ambiente (ver .env.example).
# Nenhum valor sensível possui padrão neste arquivo.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema é criado/alterado apenas pelas migrations do Flyway (db/migration).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-init-sql=SET application_name='CentraldoalfabetoApplication'

# Obrigatório (mínimo 32 caracteres); a aplicação não sobe sem ele.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Lista de origens permitidas, separadas por vírgula.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Upload de audio: WAV 16 kHz mono 16-bit tem cerca de 32 KB/s; 1 MB cobre ~30 s.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Diretorio do modelo Vosk, relativo ao diretorio de execucao.
vosk.model-path=${VOSK_MODEL_PATH:vosk-model}
