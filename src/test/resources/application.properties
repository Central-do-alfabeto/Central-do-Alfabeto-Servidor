# Configuração de teste: H2 em memória em modo PostgreSQL, sem banco externo.
# O domínio "jsonb" permite rodar a mesma migration do PostgreSQL no H2.
spring.datasource.url=jdbc:h2:mem:centraldoalfabeto;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS jsonb AS JSON
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-init-sql=
spring.datasource.hikari.initialization-fail-timeout=10000
spring.jpa.hibernate.ddl-auto=validate

# Valores fictícios apenas para testes
jwt.secret=segredo-de-teste-com-mais-de-32-caracteres-fixos
jwt.expiration-ms=3600000
cors.allowed-origins=http://localhost:5173
